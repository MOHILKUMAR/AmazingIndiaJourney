# Keeps the free Supabase project active so it never pauses (pause happens after ~7 days idle).
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> add:
#   SUPABASE_URL       e.g. https://abcdxyz.supabase.co
#   SUPABASE_ANON_KEY  Project Settings -> API -> anon public key
name: Supabase keep-alive

on:
  schedule:
    - cron: "30 3 * * *"   # every day at 03:30 UTC (9:00 AM IST)
  workflow_dispatch:        # "Run workflow" button for manual test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (with retries)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o resp.json -w "%{http_code}" -X POST \
              "$SUPABASE_URL/rest/v1/rpc/ping" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              -d '{"src":"github-action"}')
            echo "Attempt $i -> HTTP $code: $(cat resp.json)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::Supabase ping failed 3 times - check if project is paused"
          exit 1   # failed run => GitHub emails you automatically
